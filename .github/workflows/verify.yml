name: verify

# The neutral referee. Whichever agent pushed, this runs the same single gate on a clean machine.
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope and privacy checks diff against the commit that last touched the contract
          # lock, so the full history has to be present.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up the pinned environment
        run: make setup PYTHON=python

      - name: Verify
        run: make verify

      - name: Upload the verify report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: harness/out/verify_report.json
          if-no-files-found: warn
